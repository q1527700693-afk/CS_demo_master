<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101112" />
    <meta name="description" content="CS Demo Master — 校园玩家的 CS2 复盘、训练与组队工作台。" />
    <title>CS Demo Master · 复盘工作台</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html,
      body {
        margin: 0;
        background: #000;
      }
      body.starting {
        overflow: hidden;
      }
      #app[aria-hidden='true'] {
        visibility: hidden;
      }
      #startup-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        background: #000;
        color: #f1f1f1;
        font:
          14px/1.5 'Segoe UI',
          'Microsoft YaHei',
          sans-serif;
        transition: opacity 0.2s ease;
      }
      #startup-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .startup-toolbar {
        position: absolute;
        inset: auto 20px max(24px, env(safe-area-inset-bottom)) 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .startup-message {
        margin: 0;
        padding: 9px 15px;
        border-radius: 24px;
        background: #101112d9;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .startup-progress {
        width: min(560px, 100%);
        padding: 14px 18px;
        border: 1px solid #ffffff16;
        border-radius: 12px;
        background: #101112d9;
        box-sizing: border-box;
      }
      .startup-progress-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 10px;
        color: #c5c8cb;
        font-size: 12px;
      }
      #startup-percent {
        color: #ed9a60;
        font-variant-numeric: tabular-nums;
      }
      .startup-progress-track {
        height: 4px;
        border-radius: 4px;
        overflow: hidden;
        background: #ffffff20;
      }
      #startup-progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #cf7842, #f5b888);
        border-radius: inherit;
        transition: width 0.2s linear;
      }
      .startup-spinner {
        width: 13px;
        height: 13px;
        border: 2px solid #ffffff30;
        border-top-color: #ed9a60;
        border-radius: 50%;
        animation: startup-spin 0.8s linear infinite;
      }
      #startup-splash button {
        color: #fff;
        background: #222b;
        border: 1px solid #ffffff40;
        border-radius: 24px;
        padding: 9px 15px;
        font: inherit;
        cursor: pointer;
      }
      #startup-splash button:focus-visible {
        outline: 2px solid #ed9a60;
        outline-offset: 4px;
      }
      #startup-splash [hidden] {
        display: none !important;
      }
      #startup-splash.leaving {
        opacity: 0;
        pointer-events: none;
      }
      .startup-noscript {
        position: fixed;
        inset: 40% 20px auto;
        z-index: 10001;
        text-align: center;
        color: #fff;
        background: #101112;
        padding: 24px;
      }
      @keyframes startup-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #startup-splash {
          transition: none;
        }
        .startup-spinner {
          animation: none;
        }
        #startup-progress-fill {
          transition: none;
        }
      }
    </style>
  </head>
  <body class="starting">
    <section id="startup-splash" role="dialog" aria-modal="true" aria-label="应用启动">
      <video
        id="startup-video"
        src="/media/startup.mp4"
        autoplay
        muted
        playsinline
        preload="auto"
        disablepictureinpicture
        aria-hidden="true"
      ></video>
      <div class="startup-toolbar">
        <p class="startup-message" role="status">
          <span class="startup-spinner" aria-hidden="true"></span
          ><span id="startup-status">正在加载…</span>
        </p>
        <div
          class="startup-progress"
          id="startup-progress"
          role="progressbar"
          aria-label="启动进度"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div class="startup-progress-heading">
            <span>加载进度</span><span id="startup-percent" aria-hidden="true">0%</span>
          </div>
          <div class="startup-progress-track"><div id="startup-progress-fill"></div></div>
        </div>
        <button id="startup-reload" type="button" hidden>重新加载应用</button>
      </div>
    </section>
    <noscript
      ><div class="startup-noscript">请开启浏览器 JavaScript 后重新加载应用。</div></noscript
    >
    <div id="app" aria-hidden="true" inert></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
