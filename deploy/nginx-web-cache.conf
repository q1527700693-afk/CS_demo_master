# Include these locations inside the existing server block. Keep the /api/ and
# /uploads/ proxy locations and SPA try_files rule unchanged.
location = /index.html {
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Expires "0" always;
    try_files $uri =404;
}

location = /version.json {
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Expires "0" always;
    try_files $uri =404;
}

location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}
